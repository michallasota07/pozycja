<html lang="pl">
    <head>
        <meta charset="utf-8">
        <title>Pozycjonowanie elementów</title>
    </head>
        <body>
            <div style="border-style: solid;">
                <h2>flex-direction</h2><br>
                <div style="background-color:aqua; display: flex; flex-direction: column; width:50%"><p>domyslny</p></div>
                <div style="background-color:blue; display: flex; flex-direction: column; width:50%"><p>domyslny</p></div>
            </div>
            <div style="border-style: solid;">
                <h2>Flex-direction:row</h2>
                <div style="background-color: red; display: flex; flex-direction: row;"><p>2</p></div>
                <div style="background-color: orange; display: flex; flex-direction: row;"><p>3</p></div>
            </div>
                <div style="border-style: solid;">
                <h2>Flex-direction:row</h2>
                <div style="background-color: red; flex-direction: row-reverse;"><p>2</p></div>
                <div style="background-color: orange; flex-direction: row-reverse;"><p>3</p></div>
            </div>
        </body>

</html>
